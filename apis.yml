apis:
- name: MODIVO Commerce REST API
  description: >-
    The public REST surface of the MODIVO storefront, served by its Adobe Commerce / Magento 2.4
    deployment at https://modivo.pl/rest/all and self-described by a Swagger 2.0 document the
    platform generates at /rest/all/schema?services=all. 57 operations across 48 paths cover guest
    cart creation and management, shipping and totals estimation, coupon application, payment method
    selection and guest order placement, customer account creation and password reset, product
    render info, catalog search, directory (country/currency) reference data, gift messages,
    in-store pickup locations, PayPal and Braintree payment services, and MODIVO-specific extensions
    for marketplace order placement, the MODIVO My Returns webhook, a JWT issuing service and a
    Trustmate review display integration. Anonymous callers can read directory and guest-cart
    resources; everything else requires a Magento integration or customer bearer token.
  humanURL: https://modivo.pl/rest/all/schema?services=all
  baseURL: https://modivo.pl/rest/all
