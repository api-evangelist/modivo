- name: eobuwie Commerce REST API
  description: >-
    The public REST surface of eobuwie.com.pl, the MODIVO Group's footwear storefront, served by its
    own Adobe Commerce / Magento 2.4 deployment and self-described at
    https://eobuwie.com.pl/rest/all/schema?services=all. 43 operations across 35 paths cover the same
    guest cart, checkout, customer account, directory and product-render surface as MODIVO, plus
    eobuwie-specific extensions for order placement, the My Returns webhook, and a chatbot order REST
    API. Included in this profile because eobuwie is a MODIVO Group business line and eobuwie.pl S.A.
    is the legal entity that was renamed MODIVO in 2022.
  humanURL: https://eobuwie.com.pl/rest/all/schema?services=all
  baseURL: https://eobuwie.com.pl/rest/all
