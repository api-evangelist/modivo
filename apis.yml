- name: MODIVO Storefront GraphQL API
  description: >-
    The GraphQL endpoint that powers the MODIVO storefront and mobile applications, exposed at
    https://modivo.pl/graphql with introspection left open to anonymous callers. The schema carries
    770 types, 111 root query fields and 134 root mutation fields — the Adobe Commerce storefront
    schema plus a large set of MODIVO extensions: marketplace cart and offer handling, MODIVO club
    and loyalty, returns and RMA flows, product reviews, DPD and InPost parcel-shop lookup, store
    pickup places, GDPR consent management, app deep links and CMS content elements, and a wide
    payment surface (Braintree, PayPal, Klarna, PayU virtual bank accounts, vaulted cards).
    Authentication is a customer bearer token minted by generateCustomerToken and its social
    variants; unauthenticated access is limited to catalog, CMS, directory and guest-cart fields.
  humanURL: https://modivo.pl/graphql
  baseURL: https://modivo.pl/graphql
