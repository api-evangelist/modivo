- name: MODIVO Marketplace Seller API (Mirakl)
  description: >-
    MODIVO's third-party marketplace runs on a Mirakl tenant at modivo.mirakl.net. Sellers automate
    offers, stock, prices, orders and tracking numbers through the standard Mirakl Marketplace Seller
    API on that host. The tenant is closed: the console 302s to Mirakl SSO, /api/documentation and
    /api/openapi.json both return HTTP 401, and robots.txt disallows /api/. No MODIVO-published
    contract is available for this surface, so none is recorded here — only the probed evidence that
    it exists and is gated.
  humanURL: https://modivo.mirakl.net/
  baseURL: https://modivo.mirakl.net/api
