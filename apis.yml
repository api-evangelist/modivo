apis:
- name: MODIVO Storefront GraphQL API
  description: >-
    The GraphQL endpoint that powers the MODIVO storefront and mobile applications, exposed at https://modivo.pl/graphql
    with introspection left open to anonymous callers. The schema carries 770 types, 111 root query fields
    and 134 root mutation fields — the Adobe Commerce storefront schema plus a large set of MODIVO extensions:
    marketplace cart and offer handling, MODIVO club and loyalty, returns and RMA flows, product reviews,
    DPD and InPost parcel-shop lookup, store pickup places, GDPR consent management, app deep links and
    CMS content elements, and a wide payment surface (Braintree, PayPal, Klarna, PayU virtual bank accounts,
    vaulted cards). Authentication is a customer bearer token minted by generateCustomerToken and its
    social variants; unauthenticated access is limited to catalog, CMS, directory and guest-cart fields.
  humanURL: https://modivo.pl/graphql
  baseURL: https://modivo.pl/graphql
  tags:
  - GraphQL
  - E-Commerce
  - Commerce
  - Checkout
  - Catalog
  - Retail
  - Marketplace
  - Adobe Commerce
  properties:
  - type: GraphQL
    url: graphql/modivo-storefront.graphql
  - type: GraphQL
    url: https://modivo.pl/graphql
  - type: Authentication
    url: authentication/modivo-authentication.yml
  - type: Conventions
    url: conventions/modivo-conventions.yml
  - type: ToolCrosswalk
    url: mcp/modivo-tool-crosswalk.yml
- name: MODIVO Marketplace Seller API (Mirakl)
  description: >-
    MODIVO's third-party marketplace runs on a Mirakl tenant at modivo.mirakl.net. Sellers automate offers,
    stock, prices, orders and tracking numbers through the standard Mirakl Marketplace Seller API on that
    host. The tenant is closed: the console 302s to Mirakl SSO, /api/documentation and /api/openapi.json
    both return HTTP 401, and robots.txt disallows /api/. No MODIVO-published contract is available for
    this surface, so none is recorded here — only the probed evidence that it exists and is gated.
  humanURL: https://modivo.mirakl.net/
  baseURL: https://modivo.mirakl.net/api
  tags:
  - Marketplace
  - E-Commerce
  - Retail
  - Commerce
  properties:
