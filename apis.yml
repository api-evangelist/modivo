aid: modivo
name: MODIVO
description: >-
  MODIVO is a Polish multibrand fashion and lifestyle retailer that operates one of the largest
  fashion e-commerce platforms in Central and Eastern Europe, selling clothing, footwear,
  accessories, beauty and home products from more than a thousand brands across Poland, the Czech
  Republic, Slovakia, Romania, Hungary, Ukraine, the Baltics and Western Europe. MODIVO S.A. is the
  listed parent of the former CCC Group (renamed MODIVO S.A. in February 2026) and the group behind
  the eobuwie.pl, CCC, HalfPrice, worldbox and DeeZee retail brands; the MODIVO storefront company
  itself is the former eobuwie.pl S.A., a consumer-technology investment of SoftBank Vision Fund.
  MODIVO does not run a developer portal, but its storefront is an Adobe Commerce (Magento 2.4)
  deployment that serves two live, publicly readable machine contracts from its own domain: a
  self-describing Swagger 2.0 REST schema at https://modivo.pl/rest/all/schema?services=all and an
  openly introspectable GraphQL endpoint at https://modivo.pl/graphql. Third-party sellers integrate
  through a Mirakl-hosted marketplace tenant, and brands buy sponsored placements through MODIVO Ads,
  the group's retail-media platform spanning MODIVO and eobuwie.
