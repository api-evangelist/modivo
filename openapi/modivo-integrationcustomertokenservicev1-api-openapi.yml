      operationId: PostV1IntegrationCustomerToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
              type: object
              xml:
                name: request
          application/xml:
            schema:
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
              type: object
              xml:
                name: request
      responses:
        '200':
          description: 200 Success.
          content:
            application/json:
              schema:
                type: string
                description: Token created
            application/xml:
              schema:
                type: string
                description: Token created
        '400':
          description: 400 Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
        '401':
          description: 401 Unauthorized
