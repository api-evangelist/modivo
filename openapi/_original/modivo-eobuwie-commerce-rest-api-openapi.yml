            schema: *id140
      responses:
        '500':
          description: Internal Server error
          content:
            application/json:
              schema: &id141
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema: *id141
        default:
          description: Unexpected error
          content:
            application/json:
              schema: &id142
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema: *id142
