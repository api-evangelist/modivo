          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
  /V1/payments-config/apple-pay/{location}:
    get:
      tags:
      - paymentServicesPaypalPaymentConfigRequestV1
      description: Get Apple Pay Config.
      operationId: GetV1PaymentsconfigApplepayLocation
      parameters:
      - name: location
        in: path
        description: sdk location.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payment-services-paypal-data-payment-config-apple-pay-interface'
            application/xml:
              schema:
                $ref: '#/components/schemas/payment-services-paypal-data-payment-config-apple-pay-interface'
        '500':
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
  /V1/payments-config/smart-buttons/{location}:
    get:
      tags:
      - paymentServicesPaypalPaymentConfigRequestV1
      description: Get Smart Buttons Config.
      operationId: GetV1PaymentsconfigSmartbuttonsLocation
      parameters:
      - name: location
        in: path
        description: sdk location.
        required: true
        schema:
          type: string
      responses:
