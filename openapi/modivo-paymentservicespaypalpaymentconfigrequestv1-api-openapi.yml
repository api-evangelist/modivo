        is_visible:
          type: boolean
          description: Visible
        sort_order:
          type: string
          description: Sort Order
        payment_intent:
          type: string
          description: Payment intent
        title:
          type: string
          description: Title
      required:
      - display_message
      - display_venmo
      - message_styles
      - button_styles
      - code
      - sdk_params
      - is_visible
      - sort_order
      - payment_intent
      - title
    error-parameters-item:
      type: object
      description: Error parameters item
      properties:
        resources:
          type: string
          description: ACL resource
        fieldName:
          type: string
          description: Missing or invalid field name
        fieldValue:
          type: string
          description: Incorrect field value
    error-errors:
