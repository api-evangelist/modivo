      - height
      - type
    payment-services-paypal-data-payment-config-button-styles-interface:
      type: object
      description: ''
      properties:
        layout:
          type: string
          description: Layout
        color:
          type: string
          description: Color
        shape:
          type: string
          description: Shape
        label:
          type: string
          description: Label
        tagline:
          type: boolean
          description: ShowTagline
        height:
          type: integer
