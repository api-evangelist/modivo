  developer_channel: false
  detail: >-
    The only support surface is the consumer help centre. There is no developer support channel,
    forum, Slack, or issue tracker. Marketplace sellers are supported through the closed Mirakl
    tenant after onboarding.
stability_observations:
  contract_availability: >-
    Both /rest/all/schema?services=all endpoints and the GraphQL introspection endpoint answered
    anonymously on 2026-08-12. They are platform-generated, so they track the deployment
    automatically and cannot go stale relative to the running code — but they are also not guaranteed
    to stay public: an Adobe Commerce operator can disable schema exposure and anonymous introspection
    with a configuration flag at any time, with no notice channel to tell consumers it happened.
  eobuwie_graphql: >-
    https://eobuwie.com.pl/graphql returned HTTP 403 with a Polish maintenance placeholder page on
    2026-08-12 while its REST schema endpoint answered normally, so the eobuwie GraphQL surface could
    not be introspected in this pass.
