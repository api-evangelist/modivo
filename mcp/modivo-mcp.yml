note: CANDIDATE, NOT PUBLISHED. This is a proposal for what an MCP server over MODIVO's existing public
  contracts would expose, derived entirely from operations and fields that already exist. Every tool below
  names the real backing operation, so the input schema is knowable from the spec rather than invented.
  It is recorded so the tool crosswalk has a defined left-hand side and so a later pass can tell a real
  MODIVO MCP server from this derivation. Do not present it as a MODIVO product.
no_pointer_reason: Deliberately NOT wired as a type MCPServer pointer in apis.yml. An MCPServer pointer
  asserts that the PROVIDER serves an MCP endpoint; MODIVO does not. Wiring it would credit MODIVO with
  an agent surface it has never shipped — the same failure mode as advertising a WellKnown pointer over
  a 404 probe. Only mcp/modivo-tool-crosswalk.yml is wired, and that is an analytical artifact about MODIVO's
  two real contracts, not a claim about a third.
transport_proposed: streamable-http
auth_proposed:
  scheme: bearer
  detail: A customer token from generateCustomerToken (GraphQL) or POST /V1/integration/customer/token
    (REST) for anything customer-scoped; no token at all for catalog, CMS and directory reads, which MODIVO
    already serves anonymously.
