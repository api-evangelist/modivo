  mcp/modivo-mcp.yml (candidate tool set), graphql/modivo-storefront.graphql (introspected
  2026-08-12, 770 types / 111 query fields / 134 mutation fields),
  openapi/modivo-commerce-rest-api-openapi.yml (57 operations / 48 paths)
note: >-
  MODIVO runs no MCP server, so the left-hand column is the CANDIDATE tool set in mcp/modivo-mcp.yml,
  not a published one. The crosswalk is emitted anyway because the condition that makes it valuable is
  met and is unusually stark here: MODIVO exposes BOTH a REST contract and a GraphQL contract from the
  same commerce core, and they are nowhere near equivalent. The REST surface is a checkout machine —
  guest cart, shipping, payment, order — with almost no catalog and no account. The GraphQL surface is
  the whole storefront. An integrator who finds the Swagger document first and stops there will
  conclude MODIVO has no product search, no category tree, no order history, no wishlist and no
  returns. All five exist, on GraphQL. That asymmetry is the finding this file records.
