rest_only:
- operationId: GetV1Productsrenderinfo
  reason: The storefront rendering projection has no GraphQL counterpart.
- operationId: PostV1JwtObtain
  reason: MODIVO's eob JWT issuing service. Internal.
- operationId: GetV1TrustmateDisplayapi
  reason: Trustmate review-widget display integration. No GraphQL equivalent.
- operationId: PostV1OrderManagementPlaceOrder
  reason: >-
    Marketplace order ingestion. Structurally different from the storefront placeOrder mutation — it
    accepts a fully-formed multi-seller order rather than converting a quote.
- operationId: PostV1MyreturnwebhookAddreturnnumbertoorder
  reason: Inbound webhook receiver for the returns provider.
- operationId: PostV1IntegrationAdminToken
  reason: Admin integration token exchange. No GraphQL equivalent by design.
- operationId: GetV1PaymentsconfigLocation and the payments-config/payments-sdk family
  reason: >-
    PayPal Payment Services SDK and button configuration (Apple Pay, Google Pay, smart buttons, hosted
    fields) is REST-only; GraphQL has getPaymentConfig/getPaymentSDK but they are not the same shape.
- operationId: GetV1ApplepayAuth
  reason: Apple Pay merchant-validation callback. REST-only.
- operationId: GetV1Search
  reason: >-
    Magento's generic search-engine endpoint. ACL-protected — returns 401 anonymously — and returns
    framework search documents, not products. Not usable as product search.
- operationId: The gift-message family (4 operations)
  reason: Guest-cart gift messages are REST-only in this deployment.
