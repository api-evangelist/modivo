note: >-
  MODIVO publishes no compliance or standards claims of its own on any developer-facing surface.
  Every assertion below is judged against artifacts in this repo or against something probed live.
  A `conforms: false` here means "not observed", not "the provider failed an audit".
standards:
- id: openapi
  conforms: true
  version: '2.0'
  evidence: >-
    The provider's own deployment generates and serves a Swagger 2.0 document at
    https://modivo.pl/rest/all/schema?services=all (HTTP 200, application/json, 123,867 bytes,
    swagger:"2.0", host modivo.pl, 48 paths, 57 operations, 135 definitions). A second one is served
    at https://eobuwie.com.pl/rest/all/schema?services=all (89,325 bytes, 35 paths, 43 operations).
    Both are verbatim in openapi/_original/. Neither is OpenAPI 3.x; the 3.0.3 documents in openapi/
    are our mechanical conversion, not the provider's.
- id: graphql
  conforms: true
  version: June 2018 spec with @oneOf and @specifiedBy directives
  evidence: >-
    https://modivo.pl/graphql answers POST introspection anonymously with HTTP 200 — 770 types, 111
    query fields, 134 mutation fields, standard @skip/@include/@deprecated/@specifiedBy/@oneOf
    directives. No subscription type. SDL in graphql/modivo-storefront.graphql.
- id: rfc9457
  conforms: false
  evidence: >-
    No application/problem+json media type appears in either spec. Errors use the Adobe Commerce
    error-response object; GraphQL uses the standard errors[] envelope with extensions.category and
    extensions.code. See errors/modivo-problem-types.yml.
- id: idempotency
  conforms: false
  evidence: >-
    No Idempotency-Key header, no idempotency parameter, and no occurrence of the string "idempot" in
    either generated Swagger document or in the GraphQL schema. Order placement is not replay-safe.
- id: pagination
  conforms: true
  style: offset/page-based
  evidence: >-
    REST uses Adobe Commerce searchCriteria bracket notation (searchCriteria[pageSize],
    searchCriteria[currentPage], filterGroups, sortOrders) on /V1/search and /V1/products-render-info.
    GraphQL list fields take pageSize/currentPage and return page_info. Neither surface offers cursor
    pagination.
- id: oauth2
  conforms: false
  evidence: >-
    The only securityScheme declared is apiKey in the header. No authorization or token endpoint is
    advertised, and /.well-known/oauth-authorization-server returns 404 on every MODIVO host. Tokens
    are minted by a plain credential-exchange endpoint (POST /V1/integration/customer/token), which is
    not OAuth 2.0.
- id: oidc
  conforms: false
