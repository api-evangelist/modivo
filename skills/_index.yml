cross_cutting_rules:
- No idempotency anywhere. Order placement, cancellation and returns are all unsafe to retry.
- No rate limits published and no rate-limit headers returned. Self-throttle; a non-JSON body means
  Cloudflare challenged you.
- REST error messages are localized (Polish on modivo.pl, English on eobuwie.com.pl). Branch on
  status and on parameters[], not on the message.
- GraphQL resolver failures return HTTP 200 with a populated errors[]. Only authorization failures
  return 403. Always inspect errors[].
- extension_attributes is where MODIVO's own data lives on every REST entity.
- Log x-request-id / x-correlation-id / x-causation-id from GraphQL responses; they are the only
  support handle MODIVO provides.
