extension_pattern:
  name: extension_attributes
  note: >-
    Adobe Commerce's extension mechanism, and the single most important shape in this model: nearly
    every entity carries an `extension_attributes` object whose *-extension-interface schema is where
    MODIVO's own additions live. Reading only the base interface hides the provider-specific data.
    MODIVO-authored extensions found in this spec include eob-duty-calculator-data-duty-interface
    (duty calculation on the cart), instore-sales-data-quote-extended-data-interface, and
    stanley-order-create-data-attribute-interface on the marketplace order.
graphql_only_domains:
  note: >-
    The GraphQL schema is a strict superset of the REST surface for reads. Domains that exist ONLY on
    GraphQL, with no REST counterpart in the published Swagger, include:
  domains:
  - category and categoryList (catalog tree)
  - products and search with faceted aggregations
  - wishlist and compare lists
  - customer orders, returns, RMA and return carriers
  - product reviews (customerProductReviews, addProductReview)
  - MODIVO club / loyalty and consent categories
  - DPD and InPost parcel-shop lookup
  - CMS pages, blocks and app content elements
  - newsletter subscription
  - vaulted payment tokens and payment SDK configuration
