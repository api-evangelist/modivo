note: >-
  MODIVO publishes no rate limits for any API surface, and neither surface returns a rate-limit
  header. Full response headers were captured on both: the REST response carried date, content-type,
  set-cookie, vary, x-frame-options, cache-control, x-cache, age, strict-transport-security,
  cf-cache-status, server and cf-ray; the GraphQL response added x-magento-cache-id, x-route,
  x-content-type-options, x-xss-protection, x-correlation-id, x-causation-id, x-request-id and
  access-control-allow-credentials. No RateLimit-Limit, RateLimit-Remaining, RateLimit-Reset,
  X-RateLimit-*, or Retry-After appeared on any response. A consumer therefore receives no runtime
  budget signal at all and must self-throttle blind.
