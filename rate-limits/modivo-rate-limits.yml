exhaustion:
  status_code: null
  detail: >-
    Not observed. No 429 was produced during this pass and none is declared in either generated
    Swagger document — the only statuses either spec declares are 200, 400, 401, 500 and default.
enforcement:
  layer: edge
  provider: Cloudflare
  detail: >-
    Both modivo.pl and eobuwie.com.pl are served through Cloudflare (server: cloudflare, cf-ray,
    __cf_bm bot-management cookie set on every response). The practical throttle is Cloudflare bot
    management and any WAF rate-limiting rule MODIVO has configured, neither of which is documented
    or signalled in-band. Expect a Cloudflare challenge or block page rather than a well-formed API
    429. advertising.modivo.com and modivo.mirakl.net were not load-probed.
guidance: >-
  Treat this as an undocumented, edge-throttled surface. Keep concurrency low, back off on any
  non-JSON response body (a Cloudflare interstitial is HTML, not the Magento error envelope), and
  send a real identifying User-Agent — a default library UA was enough to draw an HTTP 403 HTML
  challenge on eobuwie.com.pl/graphql during this pass.
